# Netlify — build en headers (CLAUDE.md § 4). Redirects: public/_redirects (gegenereerd uit scrape/redirects.csv).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Pas bij livegang op het echte domein op "true" zetten (Site configuration → Environment variables).
  # Zolang dit niet "true" is, krijgt elke pagina <meta name="robots" content="noindex"> (preview niet in Google).
  PUBLIEK = "false"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
